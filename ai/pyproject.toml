[project]
name = "money-support-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-core>=1.7.4",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "deepeval>=4.3.3",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["*Test.py"]
python_classes = ["*Test"]
addopts = "--import-mode=importlib -m 'not live'"
markers = ["live: calls the real Azure OpenAI model"]
