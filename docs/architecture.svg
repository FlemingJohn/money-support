<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 830" width="1280" height="830" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Money Support Agent architecture</title>
  <desc id="description">A caller rings the Twilio number or uses the test call page. Vapi hears, thinks and speaks. After the call Vapi sends a report to the backend, which asks ai/ to analyse it on Azure OpenAI, saves the masked call in Supabase, and emails the support team after a hand-off. The team reviews the call and calls back from the dashboard. Admin edits sync the agent through ai/ to Vapi.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#17140c"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a39c8a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17140c" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1280" height="830" fill="#f7f7f5"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#17140c">Money Support Agent: how a call flows</text>
  <text x="40" y="74" font-size="14" fill="#5f594b">Numbers follow one call. Letters follow an admin change.</text>

  <g id="caller">
    <circle cx="90" cy="228" r="18" fill="#f1ede2" stroke="#17140c" stroke-width="2.5"/>
    <path d="M58 290 C58 254 122 254 122 290 Z" fill="#17140c"/>
    <rect x="103" y="226" width="13" height="24" rx="3" fill="#ffffff" stroke="#17140c" stroke-width="2" transform="rotate(18 109 238)"/>
    <path d="M126 214 q8 8 0 16 M132 208 q14 14 0 28" fill="none" stroke="#e3a600" stroke-width="2.5" stroke-linecap="round"/>
    <text x="90" y="314" font-size="15" font-weight="700" fill="#17140c" text-anchor="middle">Caller</text>
  </g>

  <g id="twilio" filter="url(#shadow)">
    <rect x="180" y="166" width="150" height="84" rx="10" fill="#ffffff" stroke="#e8e4d8"/>
    <rect x="198" y="184" width="26" height="44" rx="5" fill="#fff8db" stroke="#17140c" stroke-width="2"/>
    <line x1="206" y1="190" x2="216" y2="190" stroke="#17140c" stroke-width="2" stroke-linecap="round"/>
    <circle cx="211" cy="221" r="2.5" fill="#17140c"/>
    <text x="234" y="203" font-size="14" font-weight="700" fill="#17140c">Twilio</text>
    <text x="234" y="222" font-size="12" fill="#5f594b">phone number</text>
  </g>

  <g id="browser" filter="url(#shadow)">
    <rect x="180" y="288" width="150" height="84" rx="10" fill="#ffffff" stroke="#e8e4d8"/>
    <rect x="194" y="306" width="36" height="24" rx="3" fill="#fff8db" stroke="#17140c" stroke-width="2"/>
    <path d="M188 336 H236 L232 342 H192 Z" fill="#17140c"/>
    <rect x="207" y="311" width="9" height="13" rx="4.5" fill="#17140c"/>
    <text x="240" y="325" font-size="14" font-weight="700" fill="#17140c">Test call</text>
    <text x="240" y="344" font-size="12" fill="#5f594b">in the browser</text>
  </g>

  <g id="vapi">
    <rect x="378" y="124" width="324" height="282" rx="16" fill="#fff8db" stroke="#e3a600" stroke-width="2"/>
    <text x="398" y="154" font-size="17" font-weight="700" fill="#17140c">Vapi · the live call</text>
    <text x="398" y="173" font-size="12" fill="#5f594b">none of our code sits on the call</text>

    <circle cx="436" cy="232" r="30" fill="#ffffff" stroke="#17140c" stroke-width="2"/>
    <g stroke="#17140c" stroke-width="3" stroke-linecap="round">
      <line x1="422" y1="226" x2="422" y2="238"/><line x1="429" y1="218" x2="429" y2="246"/><line x1="436" y1="222" x2="436" y2="242"/><line x1="443" y1="214" x2="443" y2="250"/><line x1="450" y1="226" x2="450" y2="238"/>
    </g>
    <text x="436" y="280" font-size="13" font-weight="700" fill="#17140c" text-anchor="middle">Hears</text>
    <text x="436" y="296" font-size="11" fill="#5f594b" text-anchor="middle">Deepgram nova-3</text>

    <circle cx="540" cy="232" r="30" fill="#ffffff" stroke="#17140c" stroke-width="2"/>
    <path d="M522 220 h36 a6 6 0 0 1 6 6 v14 a6 6 0 0 1 -6 6 h-20 l-8 8 v-8 h-8 a6 6 0 0 1 -6 -6 v-14 a6 6 0 0 1 6 -6 z" fill="#ffd23f" stroke="#17140c" stroke-width="2"/>
    <circle cx="532" cy="233" r="2.5" fill="#17140c"/><circle cx="540" cy="233" r="2.5" fill="#17140c"/><circle cx="548" cy="233" r="2.5" fill="#17140c"/>
    <text x="540" y="280" font-size="13" font-weight="700" fill="#17140c" text-anchor="middle">Thinks</text>
    <text x="540" y="296" font-size="11" fill="#5f594b" text-anchor="middle">gpt-4o + six FAQs</text>

    <circle cx="644" cy="232" r="30" fill="#ffffff" stroke="#17140c" stroke-width="2"/>
    <path d="M628 226 h8 l10 -9 v30 l-10 -9 h-8 z" fill="#17140c"/>
    <path d="M652 224 q6 8 0 16 M658 218 q12 14 0 28" fill="none" stroke="#17140c" stroke-width="2.5" stroke-linecap="round"/>
    <text x="644" y="280" font-size="13" font-weight="700" fill="#17140c" text-anchor="middle">Speaks</text>
    <text x="644" y="296" font-size="11" fill="#5f594b" text-anchor="middle">Vapi voice, 0.9 speed</text>

    <line x1="468" y1="232" x2="506" y2="232" stroke="#17140c" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="572" y1="232" x2="610" y2="232" stroke="#17140c" stroke-width="2" marker-end="url(#arrow)"/>

    <g font-size="11" fill="#17140c">
      <rect x="396" y="314" width="140" height="24" rx="12" fill="#ffffff" stroke="#e8e4d8"/>
      <path d="M410 320 l7 3 v4 c0 4 -7 7 -7 7 c0 0 -7 -3 -7 -7 v-4 z" fill="#1f7a4d"/>
      <text x="422" y="330">Prompt-injection filter</text>
      <rect x="544" y="314" width="142" height="24" rx="12" fill="#ffffff" stroke="#e8e4d8"/>
      <path d="M558 320 l7 3 v4 c0 4 -7 7 -7 7 c0 0 -7 -3 -7 -7 v-4 z" fill="#1f7a4d"/>
      <text x="570" y="330">Krisp noise filter</text>
      <rect x="396" y="346" width="140" height="24" rx="12" fill="#ffffff" stroke="#e8e4d8"/>
      <path d="M410 352 l7 3 v4 c0 4 -7 7 -7 7 c0 0 -7 -3 -7 -7 v-4 z" fill="#1f7a4d"/>
      <text x="422" y="362">Hand-off ends the call</text>
      <rect x="544" y="346" width="142" height="24" rx="12" fill="#ffffff" stroke="#e8e4d8"/>
      <path d="M558 352 l7 3 v4 c0 4 -7 7 -7 7 c0 0 -7 -3 -7 -7 v-4 z" fill="#1f7a4d"/>
      <text x="570" y="362">Asks "anything else?"</text>
    </g>
    <text x="540" y="392" font-size="11" fill="#5f594b" text-anchor="middle">guardrails Vapi applies on every call</text>
  </g>

  <g id="backend" filter="url(#shadow)">
    <rect x="770" y="146" width="196" height="128" rx="12" fill="#ffffff" stroke="#e8e4d8"/>
    <g fill="#f1ede2" stroke="#17140c" stroke-width="2">
      <rect x="788" y="166" width="44" height="14" rx="3"/><rect x="788" y="184" width="44" height="14" rx="3"/><rect x="788" y="202" width="44" height="14" rx="3"/>
    </g>
    <circle cx="824" cy="173" r="2" fill="#1f7a4d"/><circle cx="824" cy="191" r="2" fill="#1f7a4d"/><circle cx="824" cy="209" r="2" fill="#1f7a4d"/>
    <text x="842" y="180" font-size="15" font-weight="700" fill="#17140c">backend/</text>
    <text x="842" y="198" font-size="12" fill="#5f594b">NestJS</text>
    <text x="788" y="240" font-size="11.5" fill="#17140c">webhook · review triage</text>
    <text x="788" y="258" font-size="11.5" fill="#17140c">hand-off email · call backs</text>
  </g>

  <g id="ai" filter="url(#shadow)">
    <rect x="1040" y="146" width="196" height="128" rx="12" fill="#ffffff" stroke="#e8e4d8"/>
    <g stroke="#17140c" stroke-width="2">
      <line x1="1066" y1="172" x2="1088" y2="190"/><line x1="1088" y1="190" x2="1066" y2="208"/><line x1="1088" y1="190" x2="1104" y2="190"/>
    </g>
    <circle cx="1066" cy="172" r="7" fill="#ffd23f" stroke="#17140c" stroke-width="2"/>
    <circle cx="1088" cy="190" r="7" fill="#ffffff" stroke="#17140c" stroke-width="2"/>
    <circle cx="1066" cy="208" r="7" fill="#ffffff" stroke="#17140c" stroke-width="2"/>
    <circle cx="1104" cy="190" r="7" fill="#1f7a4d" stroke="#17140c" stroke-width="2"/>
    <text x="1120" y="186" font-size="15" font-weight="700" fill="#17140c">ai/</text>
    <text x="1120" y="204" font-size="12" fill="#5f594b">FastAPI</text>
    <text x="1058" y="240" font-size="11.5" fill="#17140c">builds the agent prompt</text>
    <text x="1058" y="258" font-size="11.5" fill="#17140c">LangGraph call analysis</text>
  </g>

  <g id="azure">
    <path d="M1090 360 a22 22 0 0 1 8 -42 a30 30 0 0 1 56 -6 a22 22 0 0 1 28 22 a18 18 0 0 1 -4 26 z" fill="#ffffff" stroke="#17140c" stroke-width="2" filter="url(#shadow)"/>
    <text x="1138" y="342" font-size="13" font-weight="700" fill="#17140c" text-anchor="middle">Azure OpenAI</text>
    <text x="1138" y="380" font-size="11" fill="#5f594b" text-anchor="middle">gpt-4o · masks · summarises</text>
  </g>

  <g id="supabase">
    <path d="M1100 438 v52 a44 12 0 0 0 88 0 v-52" fill="#e6f2ec" stroke="#17140c" stroke-width="2"/>
    <ellipse cx="1144" cy="438" rx="44" ry="12" fill="#e6f2ec" stroke="#17140c" stroke-width="2"/>
    <path d="M1100 464 a44 12 0 0 0 88 0" fill="none" stroke="#17140c" stroke-width="1.5"/>
    <text x="1144" y="526" font-size="13" font-weight="700" fill="#17140c" text-anchor="middle">Supabase</text>
    <text x="1144" y="542" font-size="11" fill="#5f594b" text-anchor="middle">masked calls · reviews</text>
  </g>

  <g id="team">
    <circle cx="150" cy="606" r="18" fill="#f1ede2" stroke="#17140c" stroke-width="2.5"/>
    <path d="M130 604 a20 20 0 0 1 40 0" fill="none" stroke="#17140c" stroke-width="3"/>
    <rect x="125" y="600" width="7" height="12" rx="3" fill="#17140c"/><rect x="168" y="600" width="7" height="12" rx="3" fill="#17140c"/>
    <path d="M128 612 q4 14 18 14" fill="none" stroke="#17140c" stroke-width="2"/>
    <path d="M118 668 C118 632 182 632 182 668 Z" fill="#17140c"/>
    <text x="150" y="692" font-size="15" font-weight="700" fill="#17140c" text-anchor="middle">Support team</text>
  </g>

  <g id="gmail" filter="url(#shadow)">
    <rect x="300" y="566" width="170" height="96" rx="10" fill="#ffffff" stroke="#e8e4d8"/>
    <rect x="318" y="586" width="46" height="32" rx="4" fill="#fdebd3" stroke="#17140c" stroke-width="2"/>
    <path d="M318 590 l23 16 l23 -16" fill="none" stroke="#17140c" stroke-width="2"/>
    <text x="374" y="600" font-size="14" font-weight="700" fill="#17140c">Gmail</text>
    <text x="374" y="617" font-size="11" fill="#5f594b">hand-off email</text>
    <text x="318" y="644" font-size="11" fill="#8a4300">⚠ Missed transfer, call back</text>
  </g>

  <g id="dashboard" filter="url(#shadow)">
    <rect x="560" y="530" width="400" height="200" rx="12" fill="#ffffff" stroke="#e8e4d8"/>
    <path d="M560 542 a12 12 0 0 1 12 -12 h376 a12 12 0 0 1 12 12 v14 h-400 z" fill="#f1ede2"/>
    <circle cx="578" cy="544" r="4" fill="#e8e4d8"/><circle cx="592" cy="544" r="4" fill="#e8e4d8"/><circle cx="606" cy="544" r="4" fill="#e8e4d8"/>
    <text x="760" y="548" font-size="11" fill="#5f594b" text-anchor="middle">frontend/ Next.js dashboard</text>
    <rect x="560" y="556" width="96" height="174" fill="#faf9f5"/>
    <text x="574" y="582" font-size="11" fill="#5f594b">Overview</text>
    <text x="574" y="602" font-size="11" fill="#5f594b">Calls</text>
    <rect x="566" y="610" width="84" height="22" rx="6" fill="#ffefad"/>
    <text x="574" y="625" font-size="11" font-weight="700" fill="#17140c">Review</text>
    <circle cx="636" cy="621" r="8" fill="#17140c"/><text x="636" y="625" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="574" y="652" font-size="11" fill="#5f594b">FAQs</text>
    <text x="574" y="672" font-size="11" fill="#5f594b">Settings</text>
    <text x="672" y="584" font-size="14" font-weight="700" fill="#17140c">Issue with bank account</text>
    <rect x="672" y="594" width="94" height="22" rx="11" fill="#fdebd3"/>
    <path d="M682 602 h12 l-3 -3 M694 608 h-12 l3 3" fill="none" stroke="#8a4300" stroke-width="1.8" stroke-linecap="round"/>
    <text x="700" y="609" font-size="11" font-weight="700" fill="#8a4300">Handed off</text>
    <rect x="774" y="594" width="44" height="22" rx="11" fill="#f1ede2"/><text x="796" y="609" font-size="11" fill="#17140c" text-anchor="middle">Open</text>
    <rect x="672" y="626" width="11" height="8" rx="1.5" fill="none" stroke="#5f594b" stroke-width="1.5"/><path d="M672 627 l5.5 4 l5.5 -4" fill="none" stroke="#5f594b" stroke-width="1.2"/>
    <text x="690" y="634" font-size="11" fill="#5f594b">Emailed the team at 15:25 · +91 ••••• ••363</text>
    <rect x="672" y="646" width="268" height="40" rx="6" fill="#eeeae0"/>
    <text x="682" y="662" font-size="10.5" fill="#3d372a">Caller: my account is [bank account number removed]</text>
    <text x="682" y="678" font-size="10.5" fill="#3d372a">Agent: Please contact the Wise support team…</text>
    <rect x="672" y="696" width="96" height="24" rx="6" fill="#17140c"/>
    <text x="720" y="712" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Call back</text>
    <rect x="776" y="696" width="80" height="24" rx="6" fill="#ffffff" stroke="#e8e4d8"/>
    <text x="816" y="712" font-size="11" fill="#17140c" text-anchor="middle">Resolve</text>
  </g>

  <g fill="none" stroke-width="2">
    <line x1="124" y1="208" x2="176" y2="208" stroke="#17140c" marker-end="url(#arrow)"/>
    <path d="M110 300 C130 330 150 330 176 330" stroke="#a39c8a" stroke-dasharray="6 5" marker-end="url(#arrowMuted)"/>
    <line x1="330" y1="208" x2="374" y2="208" stroke="#17140c" marker-end="url(#arrow)"/>
    <line x1="330" y1="330" x2="374" y2="330" stroke="#a39c8a" stroke-dasharray="6 5" marker-end="url(#arrowMuted)"/>
    <path d="M400 406 C320 470 140 440 98 322" stroke="#17140c" marker-end="url(#arrow)"/>
    <line x1="702" y1="196" x2="766" y2="196" stroke="#17140c" marker-end="url(#arrow)"/>
    <line x1="966" y1="186" x2="1036" y2="186" stroke="#17140c" marker-end="url(#arrow)"/>
    <line x1="1036" y1="234" x2="970" y2="234" stroke="#a39c8a" stroke-dasharray="6 5" marker-end="url(#arrowMuted)"/>
    <line x1="1138" y1="274" x2="1138" y2="306" stroke="#17140c" marker-end="url(#arrow)"/>
    <path d="M940 274 C980 360 1040 420 1096 446" stroke="#17140c" marker-end="url(#arrow)"/>
    <path d="M800 274 C790 450 520 470 410 562" stroke="#17140c" marker-end="url(#arrow)"/>
    <line x1="300" y1="614" x2="192" y2="614" stroke="#17140c" marker-end="url(#arrow)"/>
    <path d="M150 700 C150 790 540 800 610 732" stroke="#17140c" marker-end="url(#arrow)"/>
    <line x1="880" y1="528" x2="880" y2="278" stroke="#17140c" marker-end="url(#arrow)"/>
    <path d="M1138 144 C1138 96 560 92 548 120" stroke="#e3a600" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  </g>

  <g font-size="12" fill="#17140c">
    <text x="248" y="462" font-size="11.5" fill="#17140c">answers, or says the hand-off sentence and hangs up</text>
    <text x="734" y="186" font-size="11" fill="#5f594b" text-anchor="middle">report</text>
    <text x="1001" y="210" font-size="11" fill="#5f594b" text-anchor="middle">analyse</text>
    <text x="1001" y="254" font-size="11" fill="#5f594b" text-anchor="middle">masked</text>
    <text x="1052" y="366" font-size="11" fill="#5f594b">save</text>
    <text x="604" y="476" font-size="11" fill="#5f594b">hand-off, missed transfer, out of hours</text>
    <text x="248" y="606" font-size="11" fill="#5f594b" text-anchor="middle">inbox</text>
    <text x="360" y="790" font-size="11" fill="#5f594b">opens the Review page, calls the customer back</text>
    <text x="890" y="420" font-size="11" fill="#5f594b">edits, reviews</text>
    <text x="840" y="92" font-size="11" fill="#8a4300" text-anchor="middle">updates the assistant after an FAQ or settings change</text>
  </g>

  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="150" cy="208" r="12" fill="#ffd23f" stroke="#17140c" stroke-width="2"/><text x="150" y="212">1</text>
    <circle cx="220" cy="464" r="12" fill="#ffd23f" stroke="#17140c" stroke-width="2"/><text x="220" y="468">2</text>
    <circle cx="734" cy="208" r="12" fill="#ffd23f" stroke="#17140c" stroke-width="2"/><text x="734" y="212">3</text>
    <circle cx="986" cy="166" r="12" fill="#ffd23f" stroke="#17140c" stroke-width="2"/><text x="986" y="170">4</text>
    <circle cx="1160" cy="292" r="12" fill="#ffd23f" stroke="#17140c" stroke-width="2"/><text x="1160" y="296">5</text>
    <circle cx="1032" cy="362" r="12" fill="#ffd23f" stroke="#17140c" stroke-width="2"/><text x="1032" y="366">6</text>
    <circle cx="588" cy="472" r="12" fill="#ffd23f" stroke="#17140c" stroke-width="2"/><text x="588" y="476">7</text>
    <circle cx="340" cy="786" r="12" fill="#ffd23f" stroke="#17140c" stroke-width="2"/><text x="340" y="790">8</text>
    <circle cx="880" cy="440" r="12" fill="#ffffff" stroke="#17140c" stroke-width="2"/><text x="880" y="444">A</text>
    <circle cx="1016" cy="166" r="12" fill="#ffffff" stroke="#17140c" stroke-width="2"/><text x="1016" y="170">B</text>
    <circle cx="840" cy="110" r="12" fill="#ffffff" stroke="#e3a600" stroke-width="2"/><text x="840" y="114">C</text>
  </g>

  <g id="legend">
    <rect x="990" y="566" width="266" height="254" rx="12" fill="#ffffff" stroke="#e8e4d8"/>
    <text x="1008" y="592" font-size="14" font-weight="700" fill="#17140c">Steps</text>
    <g font-size="11.5" fill="#17140c">
      <text x="1008" y="614">1  Caller rings the number or the test call</text>
      <text x="1008" y="633">2  Vapi answers, or hands off and hangs up</text>
      <text x="1008" y="652">3  Vapi sends the end-of-call report</text>
      <text x="1008" y="671">4  backend asks ai/ to analyse the call</text>
      <text x="1008" y="690">5  ai/ masks and summarises on Azure</text>
      <text x="1008" y="709">6  backend saves the masked call</text>
      <text x="1008" y="728">7  hand-off email goes to the team</text>
      <text x="1008" y="747">8  team reviews and calls back</text>
      <text x="1008" y="772" fill="#5f594b">A  admin edits FAQs or settings</text>
      <text x="1008" y="790" fill="#5f594b">B  backend asks ai/ to rebuild the agent</text>
      <text x="1008" y="808" fill="#5f594b">C  ai/ updates the Vapi assistant</text>
    </g>
  </g>
</svg>
